# =============================================================
# 模式 A（多实例 + 负载均衡）的单节点单元：一个节点 = 一个独立 vLLM 实例
#
# 使用方式：
#   1. 在每个 GPU 节点上分别执行：docker compose -f deploy/docker-compose.yml up -d
#   2. 在网关节点执行：docker compose -f deploy/docker-compose.nginx.yml up -d
#      （Nginx 会自动把请求分发到 NODES 列出的各节点）
#   一键编排也可直接用：bash deploy/scripts/deploy_multinode.sh --mode multi-instance
#
# 关键配置说明：
#   - ipc: host + shm_size：vLLM 多进程张量并行依赖共享内存传递张量，
#     默认 64MB 会导致启动报 "bus error"，必须放大
#   - deploy.resources.devices：向容器透传全部 GPU（需 nvidia-container-toolkit）
#   - 挂载 HF_HOME：避免每个节点重复下载模型（几十 GB）
# =============================================================

services:
  vllm:
    image: ${VLLM_IMAGE:-grpo-vllm:v0.8.5}
    container_name: ${CONTAINER_NAME:-vllm}
    restart: unless-stopped

    # 透传全部 GPU；如需限制可见卡，改用 device_ids: ['0,1'] 并配合 CUDA_VISIBLE_DEVICES
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # 共享内存：多卡 TP 必需
    ipc: host
    shm_size: ${SHM_SIZE:-16g}

    ports:
      - "${PORT:-8000}:${PORT:-8000}"

    environment:
      MODEL_PATH: ${MODEL_PATH:-Qwen/Qwen2.5-3B-Instruct}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-qwen2.5-3b}
      # 模式 A：TP = 本节点 GPU 数，PP=1，后端 mp（单机多卡）
      TP_SIZE: ${TP_SIZE:-1}
      PP_SIZE: ${PP_SIZE:-1}
      DISTRIBUTED_BACKEND: ${DISTRIBUTED_BACKEND:-mp}
      PORT: ${PORT:-8000}
      HOST: 0.0.0.0
      DTYPE: ${DTYPE:-auto}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-4096}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.9}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-256}
      API_KEY: ${API_KEY:-}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # vLLM 多进程会占用大量文件描述符
      VLLM_WORKER_MULTIPROC_METHOD: spawn

    volumes:
      # 模型缓存（跨节点共享一份权重，避免重复下载）
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      # 可选：挂载本地训练产物目录（MODEL_PATH 填容器内路径 /models）
      - ${MODEL_DIR:-./output}:/models:ro

    healthcheck:
      # vLLM OpenAI 服务自带 /health 端点
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 大模型加载通常需要 1~3 分钟，给足启动宽限期
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

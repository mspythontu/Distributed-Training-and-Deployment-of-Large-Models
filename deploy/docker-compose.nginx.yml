# =============================================================
# 模式 A 的负载均衡网关：Nginx 反向代理到各节点的 vLLM 实例
#
# 前置：先在 deploy/.env 中配置 NODES（逗号分隔的节点主机名/IP）
#      并运行 bash deploy/scripts/gen_nginx_conf.sh 生成 deploy/nginx/nginx.conf
#
# 使用：
#   docker compose -f deploy/docker-compose.nginx.yml up -d
#   curl http://<网关IP>:${NGINX_PORT:-8080}/v1/models
#
# 说明：
#   - 分发策略由 .env 的 NGINX_LB_METHOD 决定（least_conn / round_robin / ip_hash）
#   - proxy_read_timeout 必须放大：LLM 长文本生成可能持续数十秒甚至数分钟
# =============================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vllm-nginx
    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"

    volumes:
      # 由 gen_nginx_conf.sh 生成（含 upstream 节点列表与超时配置）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    # 等 vLLM 节点就绪后再接受流量（避免冷启动时大量 502）
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${NGINX_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

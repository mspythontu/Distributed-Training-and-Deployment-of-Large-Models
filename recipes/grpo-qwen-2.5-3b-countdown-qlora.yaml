# =============================================================
# GRPO QLoRA 微调配置：Qwen2.5-3B-Instruct + Countdown-Tasks
#
# 说明：
# - 与全参数版本相同的 GRPOConfig 参数 + QLoRA 相关扩展字段
# - 扩展字段（model_id / lora_* / bnb_*）由脚本读取，用于构建 LoraConfig
#   与 bitsandbytes 4bit 量化参数（不传给 GRPOConfig）
# - 4bit 量化与 DeepSpeed ZeRO-3 offload 存在兼容性限制，若报错请关闭
#   deepspeed_zero3.yaml 中的 offload（改 none）或改用全参数模式
#
# 启动命令：
#   accelerate launch --config_file configs/accelerate_configs/deepspeed_zero3.yaml \
#       --num_processes $((nproc - 1)) \
#       scripts/run_grpo.py --config recipes/grpo-qwen-2.5-3b-countdown-qlora.yaml
# =============================================================

# ---------- 扩展字段（脚本使用） ----------
model_id: Qwen/Qwen2.5-3B-Instruct

# QLoRA：LoRA 超参
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
# Qwen2.5 全模块 LoRA target（注意力 + 前馈）
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# QLoRA：bitsandbytes 4bit 量化
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16

# ---------- GRPOConfig 核心参数 ----------
vllm: true                        # TRL 0.18+：使用 vLLM 作为生成后端
output_dir: output/grpo-countdown-qlora
learning_rate: 5e-7
lr_scheduler_type: cosine
bf16: true
max_prompt_length: 256
max_completion_length: 1024
num_generations: 2
beta: 0.001
gradient_checkpointing: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
logging_steps: 10
save_steps: 100
max_steps: 450
warmup_ratio: 0.1
report_to: tensorboard

# ---------- 其他（可选） ----------
seed: 42
log_completions: true              # 将生成的文本记录到日志/board，便于人工检查
